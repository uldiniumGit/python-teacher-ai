<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python Teacher — Регистрация</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="logo">
            PYTHON<span>TEACHER</span>
        </div>

        <h1>Регистрация</h1>

        <p class="subtitle">
            Создайте аккаунт для обучения
        </p>


        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}


        <form
            method="POST"
            action="{{ url_for('main.register') }}"
        >

            <div class="form-group">

                <label for="username">
                    Имя пользователя
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Придумайте имя пользователя"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Придумайте пароль"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password_confirm">
                    Повторите пароль
                </label>

                <input
                    type="password"
                    id="password_confirm"
                    name="password_confirm"
                    placeholder="Повторите пароль"
                    required
                >

            </div>


            <button
                type="submit"
                class="button button-primary"
            >
                Создать аккаунт
            </button>

        </form>


        <p class="auth-link">

            Уже есть аккаунт?

            <a href="{{ url_for('main.login') }}">
                Войти
            </a>

        </p>

    </div>

</div>

</body>
</html>
